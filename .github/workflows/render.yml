name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  render:
    name: Render 1080p Glow Vector Video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Project Dependencies
        run: pnpm install

      - name: Render Remotion Video
        run: |
          mkdir -p out
          pnpm exec remotion render GlowCinematic out/glow_cinematic_1080p.mp4 --gl=angle

      - name: Upload Finished MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: glow_cinematic_1080p_video
          path: out/glow_cinematic_1080p.mp4
          retention-days: 14
